<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#06070C" />
    <title>POMO — studio</title>
    <meta name="description" content="Focus timer with five moods, each with its own animated backdrop." />
    <link rel="icon" href="../../assets/img/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/tokens.css">
    <link rel="stylesheet" href="../../assets/css/app.css">

    <style>
        /* ═══════════════════════════════════════════
   POMO · app styles
   ═══════════════════════════════════════════ */

        body {
            overflow: hidden;
        }

        /* Per-preset accent — updated by JS */
        :root {
            --p1: #6D8BFF;
            --p2: #8B5CF6;
            --ring: clamp(240px, 62vmin, 360px);
        }

        /* ─────────────────────────────────────────
   STAGE & BACKGROUND
   ───────────────────────────────────────── */
        .pomo-main {
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .pomo-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            background:
                radial-gradient(ellipse 100% 70% at 50% 40%, var(--p1) 0%, transparent 65%),
                #06070C;
            transition: background .8s var(--ease);
        }

        .scene {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 1s var(--ease);
            pointer-events: none;
        }

        .scene.active {
            opacity: 1;
        }

        .scene:not(.active) * {
            animation-play-state: paused !important;
        }

        .scene svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Readability scrim — center stays clear */
        .pomo-scrim {
            position: absolute;
            inset: 0;
            z-index: 1;
            background:
                radial-gradient(ellipse 90% 60% at 50% 46%, transparent 30%, rgba(6, 7, 12, .55) 100%),
                linear-gradient(180deg, rgba(6, 7, 12, .4) 0%, transparent 22%, transparent 74%, rgba(6, 7, 12, .55) 100%);
            pointer-events: none;
        }

        /* ─────────────────────────────────────────
   SCENE ANIMATIONS
   ───────────────────────────────────────── */
        @keyframes rainFall {
            from {
                transform: translateY(0)
            }

            to {
                transform: translateY(120px)
            }
        }

        @keyframes rainFall2 {
            from {
                transform: translateY(0)
            }

            to {
                transform: translateY(120px)
            }
        }

        .rain-a {
            animation: rainFall 1.4s linear infinite;
        }

        .rain-b {
            animation: rainFall2 1.1s linear infinite;
        }

        @keyframes auroraShift {
            from {
                transform: translateX(-90px) scaleY(1)
            }

            to {
                transform: translateX(90px) scaleY(1.1)
            }
        }

        .aurora-1 {
            animation: auroraShift 22s ease-in-out infinite alternate;
        }

        .aurora-2 {
            animation: auroraShift 30s ease-in-out infinite alternate-reverse;
        }

        .aurora-3 {
            animation: auroraShift 26s ease-in-out infinite alternate;
        }

        @keyframes sunBreathe {

            0%,
            100% {
                opacity: .55;
                transform: scale(1)
            }

            50% {
                opacity: .85;
                transform: scale(1.05)
            }
        }

        .sun-breathe {
            animation: sunBreathe 9s ease-in-out infinite;
        }

        @keyframes sunPulse {
            0% {
                transform: scale(.4);
                opacity: .6
            }

            100% {
                transform: scale(2.4);
                opacity: 0
            }
        }

        .sun-pulse {
            animation: sunPulse 6s cubic-bezier(.2, .7, .4, 1) infinite;
        }

        @keyframes pageRise {
            0% {
                transform: translateY(40px) rotate(var(--rot, 0deg));
                opacity: 0
            }

            15% {
                opacity: .75
            }

            90% {
                opacity: .5
            }

            100% {
                transform: translateY(-720px) rotate(calc(var(--rot, 0deg) + 30deg));
                opacity: 0
            }
        }

        .page-rise {
            animation: pageRise 18s linear infinite;
        }

        @keyframes orbitSpin {
            to {
                transform: rotate(360deg)
            }
        }

        .orbit-1 {
            animation: orbitSpin 40s linear infinite;
        }

        .orbit-2 {
            animation: orbitSpin 60s linear infinite reverse;
        }

        .orbit-3 {
            animation: orbitSpin 90s linear infinite;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: .15
            }

            50% {
                opacity: .7
            }
        }

        .twinkle {
            animation: twinkle 4s ease-in-out infinite;
        }

        @keyframes bokehDrift {

            0%,
            100% {
                transform: translate(0, 0)
            }

            50% {
                transform: translate(-30px, -40px)
            }
        }

        .bokeh {
            animation: bokehDrift 20s ease-in-out infinite;
        }

        /* ─────────────────────────────────────────
   STAGE
   ───────────────────────────────────────── */
        .pomo-stage {
            position: relative;
            z-index: 2;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(18px, 3.5vh, 32px);
            padding: clamp(16px, 3vh, 28px) clamp(16px, 3vw, 28px);
            min-height: 0;
        }

        /* ─────────────────────────────────────────
   PRESETS
   ───────────────────────────────────────── */
        .pomo-presets {
            display: flex;
            gap: 6px;
            padding: 4px;
            border-radius: var(--r-md);
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, .03);
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            max-width: 100%;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .pomo-presets::-webkit-scrollbar {
            display: none;
        }

        .preset-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px 8px 12px;
            border-radius: var(--r-sm);
            border: none;
            background: transparent;
            color: var(--muted);
            font-family: inherit;
            font-size: 12.5px;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            transition: var(--dur-base) var(--ease);
            flex: 0 0 auto;
        }

        .preset-chip:hover {
            color: #fff;
        }

        .preset-chip .p-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex: 0 0 auto;
            transition: box-shadow var(--dur-base) var(--ease);
        }

        .preset-chip.active {
            color: #fff;
            background: color-mix(in srgb, var(--p1) 18%, rgba(255, 255, 255, .03));
            box-shadow:
                0 8px 20px -12px var(--p1),
                inset 0 1px 0 rgba(255, 255, 255, .08);
        }

        .preset-chip.active .p-dot {
            box-shadow: 0 0 10px var(--p1);
        }

        /* ─────────────────────────────────────────
   TIMER RING
   ───────────────────────────────────────── */
        .pomo-ring-wrap {
            position: relative;
            width: var(--ring);
            height: var(--ring);
            flex: 0 0 auto;
            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, .5));
        }

        .pomo-ring {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
            overflow: visible;
            display: block;
        }

        .ring-track {
            fill: none;
            stroke: rgba(255, 255, 255, .07);
            stroke-width: 9;
        }

        .ring-progress {
            fill: none;
            stroke: url(#pomoGrad);
            stroke-width: 9;
            stroke-linecap: round;
            stroke-dasharray: 879.646;
            stroke-dashoffset: 879.646;
            transition: stroke-dashoffset .2s linear;
            filter: drop-shadow(0 0 14px var(--p1));
        }

        .ring-head {
            transition: opacity var(--dur-base) var(--ease);
        }

        /* ─────────────────────────────────────────
   TIMER CENTER
   ───────────────────────────────────────── */
        .pomo-center {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            pointer-events: none;
        }

        .pomo-phase {
            font-size: calc(var(--ring) * 0.037);
            font-weight: 600;
            letter-spacing: .22em;
            text-transform: uppercase;
            color: var(--p1);
            margin-bottom: calc(var(--ring) * 0.032);
            transition: color .5s var(--ease);
        }

        .pomo-time {
            font-family: var(--font-display);
            font-size: calc(var(--ring) * 0.21);
            font-weight: 600;
            letter-spacing: -.04em;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            color: #fff;
            text-shadow: 0 0 60px color-mix(in srgb, var(--p1) 40%, transparent);
        }

        .pomo-round {
            font-size: calc(var(--ring) * 0.037);
            color: var(--muted);
            margin-top: calc(var(--ring) * 0.042);
            letter-spacing: .005em;
        }

        .pomo-dots {
            display: flex;
            gap: calc(var(--ring) * 0.018);
            margin-top: calc(var(--ring) * 0.03);
        }

        .pomo-dots i {
            width: calc(var(--ring) * 0.014);
            height: calc(var(--ring) * 0.014);
            border-radius: 50%;
            background: rgba(255, 255, 255, .14);
            transition: var(--dur-base) var(--ease);
        }

        .pomo-dots i.on {
            background: var(--p1);
            box-shadow: 0 0 9px var(--p1);
        }

        /* ─────────────────────────────────────────
   CONTROLS
   ───────────────────────────────────────── */
        .pomo-controls {
            display: flex;
            align-items: center;
            gap: clamp(10px, calc(var(--ring) * 0.055), 16px);
            flex: 0 0 auto;
        }

        .ctrl-btn {
            width: clamp(44px, calc(var(--ring) * 0.155), 54px);
            height: clamp(44px, calc(var(--ring) * 0.155), 54px);
            border-radius: clamp(13px, calc(var(--ring) * 0.048), 16px);
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, .035);
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            color: var(--muted);
            display: grid;
            place-items: center;
            cursor: pointer;
            transition: var(--dur-base) var(--ease);
        }

        .ctrl-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, .07);
            border-color: var(--line-2);
            transform: translateY(-1px);
        }

        .ctrl-btn:active {
            transform: translateY(0) scale(.94);
        }

        .ctrl-btn svg {
            width: 19px;
            height: 19px;
        }

        .ctrl-btn.play {
            min-width: clamp(120px, calc(var(--ring) * 0.46), 156px);
            width: auto;
            padding: 0 clamp(20px, calc(var(--ring) * 0.08), 28px);
            border: none;
            background: linear-gradient(135deg, var(--p1), var(--p2));
            color: var(--bg);
            font-family: inherit;
            font-size: clamp(14px, calc(var(--ring) * 0.045), 15px);
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow:
                0 12px 32px -14px var(--p1),
                inset 0 1px 0 rgba(255, 255, 255, .35);
        }

        .ctrl-btn.play:hover {
            transform: translateY(-2px);
            box-shadow:
                0 18px 42px -14px var(--p1),
                inset 0 1px 0 rgba(255, 255, 255, .45);
        }

        .ctrl-btn.play svg {
            width: 17px;
            height: 17px;
        }

        /* ─────────────────────────────────────────
   SETTINGS SHEET
   ───────────────────────────────────────── */
        .sheet-overlay {
            position: fixed;
            inset: 0;
            z-index: var(--z-overlay);
            display: grid;
            place-items: end center;
            background: rgba(4, 4, 7, .65);
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            opacity: 0;
            pointer-events: none;
            transition: opacity .28s var(--ease);
        }

        .sheet-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .sheet {
            width: min(520px, 100%);
            max-height: 88dvh;
            overflow-y: auto;
            border-radius: 26px 26px 0 0;
            border: 1px solid var(--line-2);
            border-bottom: none;
            background: linear-gradient(180deg, rgba(24, 24, 30, .98), rgba(14, 14, 19, .99));
            padding: clamp(20px, 3vh, 28px) clamp(20px, 4vw, 28px) calc(clamp(20px, 3vh, 28px) + env(safe-area-inset-bottom));
            box-shadow: 0 -30px 80px -20px rgba(0, 0, 0, .85);
            transform: translateY(24px);
            transition: transform .34s var(--ease);
            scrollbar-width: thin;
        }

        .sheet-overlay.open .sheet {
            transform: none;
        }

        .sheet-grab {
            width: 36px;
            height: 4px;
            border-radius: 99px;
            background: rgba(255, 255, 255, .14);
            margin: 0 auto 18px;
        }

        .sheet-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 20px;
        }

        .sheet-head h2 {
            margin: 0;
            font-family: var(--font-display);
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -.014em;
            color: #fff;
        }

        .sheet-head h2 span {
            color: var(--p1);
        }

        .sheet-close {
            width: 32px;
            height: 32px;
            border-radius: var(--r-sm);
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, .03);
            color: var(--muted);
            display: grid;
            place-items: center;
            cursor: pointer;
            transition: var(--dur-base) var(--ease);
        }

        .sheet-close:hover {
            color: #fff;
            background: rgba(255, 255, 255, .08);
        }

        .sheet-close svg {
            width: 14px;
            height: 14px;
        }

        .field {
            margin-bottom: 18px;
        }

        .field-top {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .field-top label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-2);
        }

        .field-top .val {
            font-family: var(--font-mono);
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            font-variant-numeric: tabular-nums;
        }

        .field-top .val small {
            font-family: inherit;
            font-size: 10.5px;
            font-weight: 500;
            color: var(--muted);
            margin-left: 3px;
        }

        input[type=range].pomo-range {
            -webkit-appearance: none;
            appearance: none;
            display: block;
            width: 100%;
            height: 20px;
            background-color: transparent;
            background-image: linear-gradient(90deg,
                    var(--p1) 0%,
                    var(--p2) var(--pct, 50%),
                    rgba(255, 255, 255, .09) var(--pct, 50%));
            background-size: 100% 5px;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 99px;
            outline: none;
            cursor: pointer;
        }

        input[type=range].pomo-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            border: none;
            box-shadow:
                0 0 0 4px color-mix(in srgb, var(--p1) 28%, transparent),
                0 2px 8px rgba(0, 0, 0, .55);
            transition: box-shadow .2s var(--ease);
        }

        input[type=range].pomo-range::-webkit-slider-thumb:hover {
            box-shadow:
                0 0 0 7px color-mix(in srgb, var(--p1) 30%, transparent),
                0 2px 8px rgba(0, 0, 0, .55);
        }

        input[type=range].pomo-range::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            border: none;
            box-shadow:
                0 0 0 4px color-mix(in srgb, var(--p1) 28%, transparent),
                0 2px 8px rgba(0, 0, 0, .55);
        }

        .sheet-actions {
            display: flex;
            gap: 10px;
            margin-top: 22px;
        }

        /* ─────────────────────────────────────────
   RESPONSIVE
   ───────────────────────────────────────── */
        @media (max-height: 640px) {
            :root {
                --ring: clamp(180px, 52vmin, 260px);
            }

            .pomo-round {
                display: none;
            }
        }

        @media (max-height: 480px) {
            :root {
                --ring: clamp(150px, 44vmin, 200px);
            }

            .pomo-dots {
                display: none;
            }
        }

        @media (max-width: 380px) {
            .preset-chip {
                padding: 7px 11px 7px 10px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body class="app-shell">

                <polyline points="15 18 9 12 15 6" />

                            <line x1="1010" y1="360" x2="1006" y2="372" />

                            <line x1="1110" y1="370" x2="1106" y2="382" />
                            <line x1="1160" y1="410" x2="1156" y2="422" />

    <script>

            /* ═══════════════════════════════════════════

               ═══════════════════════════════════════════ */
            const DEFAULTS = {
                study: { label: 'Study', focus: 25, short: 5, long: 15, rounds: 4, c1: '#6D8BFF', c2: '#8B5CF6' },
                deep: { label: 'Deep Work', focus: 50, short: 10, long: 25, rounds: 4, c1: '#2DD4BF', c2: '#34D399' },
                exercise: { label: 'Exercise', focus: 30, short: 5, long: 10, rounds: 3, c1: '#FF7A45', c2: '#FFC53D' },
                reading: { label: 'Reading', focus: 40, short: 8, long: 20, rounds: 4, c1: '#F472B6', c2: '#C084FC' },
                custom: { label: 'Custom', focus: 20, short: 5, long: 15, rounds: 4, c1: '#22D3EE', c2: '#A78BFA' }
            };

            const FIELDS = [
                { key: 'focus', label: 'Focus session', min: 1, max: 90, unit: 'min' },
                { key: 'short', label: 'Short break', min: 1, max: 30, unit: 'min' },
                { key: 'long', label: 'Long break', min: 5, max: 60, unit: 'min' },
                { key: 'rounds', label: 'Rounds per cycle', min: 2, max: 8, unit: '' }
            ];

            const PHASE_LABEL = { focus: 'Focus', short: 'Short Break', long: 'Long Break' };

            const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8.6 5.9a1 1 0 0 0-1.53.85v10.5a1 1 0 0 0 1.53.85l8.6-5.25a1 1 0 0 0 0-1.7L8.6 5.9Z"/></svg>';
            const ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="5.5" width="3.6" height="13" rx="1.6"/><rect x="13.4" y="5.5" width="3.6" height="13" rx="1.6"/></svg>';
            const ICON_SOUND_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6.5 9H3v6h3.5L11 19V5Z"/><path d="M15.4 8.6a4.8 4.8 0 0 1 0 6.8"/><path d="M18.4 5.6a9 9 0 0 1 0 12.8"/></svg>';
            const ICON_SOUND_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6.5 9H3v6h3.5L11 19V5Z"/><line x1="16" y1="9" x2="21" y2="15"/><line x1="21" y1="9" x2="16" y2="15"/></svg>';

            /* ═══════════════════════════════════════════
               ELEMENTS
               ═══════════════════════════════════════════ */
            const el = {
                presets: document.getElementById('presets'),
                bg: document.getElementById('pomoBg'),
                progress: document.getElementById('ringProgress'),
                head: document.getElementById('ringHead'),
                time: document.getElementById('timeLabel'),
                phase: document.getElementById('phaseLabel'),
                round: document.getElementById('roundLabel'),
                dots: document.getElementById('dots'),
                playBtn: document.getElementById('playBtn'),
                playIcon: document.getElementById('playIcon'),
                playLabel: document.getElementById('playLabel'),
                resetBtn: document.getElementById('resetBtn'),
                skipBtn: document.getElementById('skipBtn'),
                soundBtn: document.getElementById('soundBtn'),
                settingsBtn: document.getElementById('settingsBtn'),
                sheetOverlay: document.getElementById('sheetOverlay'),
                sheet: document.getElementById('sheet'),
                sheetName: document.getElementById('sheetName'),
                sheetFields: document.getElementById('sheetFields'),
                sheetClose: document.getElementById('sheetClose'),
                sheetDone: document.getElementById('sheetDone'),
                resetDefaults: document.getElementById('resetDefaults'),
                grad: document.getElementById('pomoGrad')
            };

            /* ═══════════════════════════════════════════
               STATE
               ═══════════════════════════════════════════ */
            const R = 140;
            const C = 2 * Math.PI * R;
            const STORAGE_KEY = 'pomo.v1';

            let cfg = {};
            let activeId = 'study';
            let editingId = null;
            let phase = 'focus';
            let total = 0;
            let remaining = 0;
            let running = false;
            let endAt = 0;
            let ticker = null;
            let completed = 0;
            let soundOn = true;
            let lastSec = -1;

            /* ═══════════════════════════════════════════
               STORAGE
               ═══════════════════════════════════════════ */
            function save() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify({
                        cfg: cfg,
                        active: activeId,
                        sound: soundOn
                    }));
                } catch (e) { }
            }

            function load() {
                let saved = null;
                try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch (e) { }

                cfg = {};
                Object.keys(DEFAULTS).forEach(function (k) {
                    cfg[k] = Object.assign({}, DEFAULTS[k], (saved && saved.cfg && saved.cfg[k]) ? saved.cfg[k] : {});
                });

                if (saved && saved.active && cfg[saved.active]) activeId = saved.active;
                if (saved && saved.sound === false) soundOn = false;
            }

            /* ═══════════════════════════════════════════
               ACCENT
               ═══════════════════════════════════════════ */
            function applyAccent() {
                const p = cfg[activeId];
                document.documentElement.style.setProperty('--p1', p.c1);
                document.documentElement.style.setProperty('--p2', p.c2);
                el.grad.querySelector('.s1').setAttribute('stop-color', p.c1);
                el.grad.querySelector('.s2').setAttribute('stop-color', p.c2);
            }

            function applyScene(id) {
                const scenes = el.bg.querySelectorAll('.scene');
                scenes.forEach(function (s) {
                    s.classList.toggle('active', s.dataset.scene === id);
                });
            }

            /* ═══════════════════════════════════════════
               PRESET UI
               ═══════════════════════════════════════════ */
            function buildPresets() {
                el.presets.innerHTML = '';
                Object.keys(cfg).forEach(function (id) {
                    const p = cfg[id];
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'preset-chip' + (id === activeId ? ' active' : '');
                    btn.dataset.id = id;
                    btn.setAttribute('aria-pressed', id === activeId ? 'true' : 'false');
                    btn.innerHTML =
                        '<span class="p-dot" style="background:linear-gradient(135deg,' + p.c1 + ',' + p.c2 + ')"></span>' +
                        '<span>' + p.label + '</span>';
                    btn.addEventListener('click', function () {
                        if (id === activeId) {
                            openSheet(id);
                        } else {
                            selectPreset(id);
                        }
                    });
                    el.presets.appendChild(btn);
                });
            }

            function selectPreset(id) {
                if (id === activeId || !cfg[id]) return;
                activeId = id;
                save();
                applyAccent();
                applyScene(id);
                el.presets.querySelectorAll('.preset-chip').forEach(function (c) {
                    const on = c.dataset.id === id;
                    c.classList.toggle('active', on);
                    c.setAttribute('aria-pressed', on ? 'true' : 'false');
                });
                halt();
                completed = 0;
                setPhase('focus', false);
            }

            /* ═══════════════════════════════════════════
               TIMER CORE
               ═══════════════════════════════════════════ */
            function durationFor(p) {
                const c = cfg[activeId];
                if (p === 'focus') return c.focus * 60;
                if (p === 'short') return c.short * 60;
                return c.long * 60;
            }

            function setPhase(p, autostart) {
                phase = p;
                total = durationFor(p);
                remaining = total;
                running = false;
                clearTicker();
                lastSec = -1;
                render();
                updateMeta();
                updatePlayBtn();
                if (autostart) start();
            }

            function start() {
                if (running) return;
                if (remaining <= 0) remaining = total;
                if (window.HubAudio) HubAudio.setEnabled(soundOn);
                running = true;
                endAt = performance.now() + remaining * 1000;
                clearTicker();
                ticker = setInterval(tick, 100);
                updatePlayBtn();
            }

            function pause() {
                if (!running) return;
                remaining = Math.max(0, (endAt - performance.now()) / 1000);
                running = false;
                clearTicker();
                render();
                updatePlayBtn();
            }

            function halt() {
                running = false;
                clearTicker();
            }

            function clearTicker() {
                if (ticker) { clearInterval(ticker); ticker = null; }
            }

            function tick() {
                if (!running) return;
                remaining = Math.max(0, (endAt - performance.now()) / 1000);
                render();
                if (remaining <= 0) finish();
            }

            function finish() {
                halt();
                if (window.HubAudio) HubAudio.play('chime');
                nextPhase(true);
            }

            function nextPhase(count) {
                let next;
                const rounds = cfg[activeId].rounds;

                if (phase === 'focus') {
                    if (count) completed++;
                    next = (completed > 0 && completed >= rounds) ? 'long' : 'short';
                } else {
                    if (phase === 'long') completed = 0;
                    next = 'focus';
                }
                setPhase(next, true);
            }

            function reset() {
                halt();
                remaining = total;
                lastSec = -1;
                render();
                updatePlayBtn();
            }

            function toggle() {
                if (running) pause(); else start();
            }

            /* ═══════════════════════════════════════════
               RENDER
               ═══════════════════════════════════════════ */
            function pad(n) { return n < 10 ? '0' + n : '' + n; }

            function render() {
                const secs = Math.max(0, Math.ceil(remaining - 0.0005));
                if (secs !== lastSec) {
                    lastSec = secs;
                    const str = pad(Math.floor(secs / 60)) + ':' + pad(secs % 60);
                    el.time.textContent = str;
                    document.title = str + ' · ' + PHASE_LABEL[phase] + ' — POMO';
                }

                const frac = total > 0 ? Math.max(0, Math.min(1, remaining / total)) : 0;
                el.progress.style.strokeDashoffset = (C * (1 - frac)).toFixed(2);
                el.head.setAttribute('transform', 'rotate(' + (360 * frac).toFixed(2) + ' 160 160)');
                el.head.style.opacity = (frac > 0.008 && frac < 0.992) ? '1' : '0';
            }

            function updateMeta() {
                const c = cfg[activeId];
                el.phase.textContent = PHASE_LABEL[phase];

                if (phase === 'focus') {
                    el.round.textContent = 'Round ' + Math.min(completed + 1, c.rounds) + ' of ' + c.rounds;
                } else if (phase === 'short') {
                    el.round.textContent = completed + ' of ' + c.rounds + ' complete';
                } else {
                    el.round.textContent = 'Long break — you earned it';
                }

                renderDots();
            }

            function renderDots() {
                const rounds = cfg[activeId].rounds;
                const filled = Math.min(completed, rounds);
                let html = '';
                for (let i = 0; i < rounds; i++) {
                    html += '<i class="' + (i < filled ? 'on' : '') + '"></i>';
                }
                el.dots.innerHTML = html;
            }

            function updatePlayBtn() {
                el.playLabel.textContent = running ? 'Pause' : (remaining < total - 0.5 ? 'Resume' : 'Start');
                el.playIcon.innerHTML = running ? ICON_PAUSE : ICON_PLAY;
            }

            function updateSoundBtn() {
                el.soundBtn.innerHTML = soundOn ? ICON_SOUND_ON : ICON_SOUND_OFF;
                el.soundBtn.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
                if (window.HubAudio) HubAudio.setEnabled(soundOn);
            }

            /* ═══════════════════════════════════════════
               SETTINGS SHEET
               ═══════════════════════════════════════════ */
            function buildFields() {
                el.sheetFields.innerHTML = FIELDS.map(function (f) {
                    return '' +
                        '<div class="field">' +
                        '<div class="field-top">' +
                        '<label for="f-' + f.key + '">' + f.label + '</label>' +
                        '<span class="val"><span id="v-' + f.key + '">0</span>' +
                        (f.unit ? '<small>' + f.unit + '</small>' : '') +
                        '</span>' +
                        '</div>' +
                        '<input type="range" class="pomo-range" id="f-' + f.key + '" ' +
                        'data-key="' + f.key + '" min="' + f.min + '" max="' + f.max + '" ' +
                        'step="1" value="0">' +
                        '</div>';
                }).join('');

                el.sheetFields.addEventListener('input', function (e) {
                    const inp = e.target;
                    if (inp.type !== 'range') return;
                    if (!editingId || !cfg[editingId]) return;
                    cfg[editingId][inp.dataset.key] = parseInt(inp.value, 10);
                    save();
                    syncField(inp);
                    onCfgChange();
                });
            }

            function syncField(inp) {
                const meta = FIELDS.filter(function (f) { return f.key === inp.dataset.key; })[0];
                const v = parseInt(inp.value, 10);
                const pct = ((v - meta.min) / (meta.max - meta.min)) * 100;
                inp.style.setProperty('--pct', pct.toFixed(1) + '%');
                const out = document.getElementById('v-' + inp.dataset.key);
                if (out) out.textContent = v;
            }

            function loadFieldValues() {
                const p = cfg[editingId];
                FIELDS.forEach(function (f) {
                    const inp = document.getElementById('f-' + f.key);
                    if (!inp) return;
                    inp.value = p[f.key];
                    syncField(inp);
                });
            }

            function onCfgChange() {
                if (editingId === activeId) {
                    if (!running) {
                        total = durationFor(phase);
                        remaining = total;
                        lastSec = -1;
                    }
                    render();
                    updateMeta();
                    updatePlayBtn();
                }
            }

            function openSheet(id) {
                if (!cfg[id]) return;
                editingId = id;
                const p = cfg[id];
                el.sheetName.textContent = p.label;
                el.sheet.style.setProperty('--p1', p.c1);
                el.sheet.style.setProperty('--p2', p.c2);
                loadFieldValues();
                el.sheetOverlay.classList.add('open');
            }

            function closeSheet() {
                el.sheetOverlay.classList.remove('open');
                editingId = null;
            }

            function resetDefaults() {
                if (!editingId) return;
                cfg[editingId] = Object.assign({}, DEFAULTS[editingId]);
                save();
                loadFieldValues();
                onCfgChange();
                if (editingId === activeId) {
                    applyAccent();
                    buildPresets();
                }
            }

            /* ═══════════════════════════════════════════
               EVENTS
               ═══════════════════════════════════════════ */
            function bind() {
                el.playBtn.addEventListener('click', toggle);
                el.resetBtn.addEventListener('click', reset);
                el.skipBtn.addEventListener('click', function () { nextPhase(false); });

                el.soundBtn.addEventListener('click', function () {
                    soundOn = !soundOn;
                    save();
                    updateSoundBtn();
                    if (soundOn && window.HubAudio) HubAudio.play('click');
                });

                el.settingsBtn.addEventListener('click', function () { openSheet(activeId); });
                el.sheetClose.addEventListener('click', closeSheet);
                el.sheetDone.addEventListener('click', closeSheet);
                el.resetDefaults.addEventListener('click', resetDefaults);

                el.sheetOverlay.addEventListener('click', function (e) {
                    if (e.target === el.sheetOverlay) closeSheet();
                });

                document.addEventListener('keydown', function (e) {
                    const tag = (e.target && e.target.tagName) || '';
                    if (tag === 'INPUT' || tag === 'TEXTAREA') return;

                    if (e.code === 'Space') {
                        e.preventDefault();
                        toggle();
                    } else if (e.key === 'r' || e.key === 'R') {
                        reset();
                    } else if (e.key === 's' || e.key === 'S') {
                        nextPhase(false);
                    } else if (e.key === 'Escape') {
                        closeSheet();
                    }
                });

                document.addEventListener('visibilitychange', function () {
                    if (!document.hidden && running) {
                        remaining = Math.max(0, (endAt - performance.now()) / 1000);
                        render();
                    }
                });
            }

            /* ═══════════════════════════════════════════
               BOOT
               ═══════════════════════════════════════════ */
            function init() {
                load();
                buildPresets();
                buildFields();
                applyAccent();
                applyScene(activeId);
                updateSoundBtn();
                setPhase('focus', false);
                bind();
            }

            init();
        })();
    </script>
</body>

</html>
